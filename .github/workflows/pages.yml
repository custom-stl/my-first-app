# GitHub Pages に公開して、ログインなしで使えるようにする。
# main に push するたび https://<ユーザー名>.github.io/my-first-app/ が更新される。
#
# 注意: 無料プランでは public リポジトリでしか Pages を使えない。
# private のままだと configure-pages が
# "Create Pages site failed. Resource not accessible by integration" で失敗する。
# public にすれば enablement: true により自動で有効化される。
# 有効にならない場合は Settings → Pages → Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
